<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil | Plataforma de Cursos Online</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- ================= HEADER ================= -->
  <!-- Renderizado dinamicamente por js/components/header.js -->
  <header class="site-header" id="site-header">
    <div class="container">
      <a href="catalogo.html" class="logo">MC Cursos</a>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="main-nav">
        <span class="visually-hidden">Abrir menu</span>
        ☰
      </button>

      <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
        <ul id="main-nav-list">
          <!-- Links injetados via JS conforme o role do usuário -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="container">

      <h1 class="page-title">Meu Perfil</h1>
      <p class="page-subtitle">Gerencie seus dados pessoais e acompanhe suas matrículas.</p>

      <div class="dashboard-layout">
        <!-- ================= DADOS PESSOAIS ================= -->
        <section class="card dashboard-section" aria-labelledby="profile-form-title">
          <h2 class="section-title" id="profile-form-title">Dados pessoais</h2>

          <div id="profile-alert" class="alert alert-success" role="status" hidden></div>

          <form id="profile-form" novalidate>
            <div class="form-group">
              <label for="profile-nome">Nome completo</label>
              <input type="text" id="profile-nome" name="nome" required />
            </div>

            <div class="form-group">
              <label for="profile-email">E-mail</label>
              <input type="email" id="profile-email" name="email" required />
            </div>

            <fieldset>
              <legend>Alterar senha</legend>

              <div class="form-group">
                <label for="profile-senha-atual">Senha atual</label>
                <input type="password" id="profile-senha-atual" name="senhaAtual" autocomplete="current-password" />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="profile-senha-nova">Nova senha</label>
                  <input type="password" id="profile-senha-nova" name="senhaNova" autocomplete="new-password" />
                </div>

                <div class="form-group">
                  <label for="profile-senha-confirmar">Confirmar nova senha</label>
                  <input type="password" id="profile-senha-confirmar" name="senhaConfirmar" autocomplete="new-password" />
                </div>
              </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </form>
        </section>

        <!-- ================= MINHAS MATRÍCULAS ================= -->
        <section class="card dashboard-section" aria-labelledby="enrollments-title">
          <h2 class="section-title" id="enrollments-title">Minhas matrículas</h2>

          <ul class="enrollment-list" id="enrollment-list">
            <!-- Itens de matrícula injetados via JS, ex:
            <li class="enrollment-item">
              <div class="enrollment-item__info">
                <h3>Título do curso</h3>
                <span class="badge badge-success">Em andamento</span>
              </div>
              <div class="progress-bar"><div class="progress-bar__fill" style="width: 60%"></div></div>
              <a href="curso.html?id=..." class="btn btn-secondary btn-sm">Continuar curso</a>
            </li>
            -->
          </ul>

          <p id="enrollment-empty" class="empty-state" hidden>
            Você ainda não está matriculado em nenhum curso.
            <br />
            <a href="catalogo.html" class="auth-link">Explorar catálogo</a>
          </p>
        </section>
      </div>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 MC Cursos. Todos os direitos reservados.</span>
      <nav aria-label="Links do rodapé">
        <a href="#">Termos de uso</a>
        <a href="#">Privacidade</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
