<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard do Administrador | Plataforma de Cursos Online</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- ================= HEADER ================= -->
  <!-- Renderizado dinamicamente por js/components/header.js -->
  <header class="site-header" id="site-header">
    <div class="container">
      <a href="catalogo.html" class="logo">EduPlay</a>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="main-nav">
        <span class="visually-hidden">Abrir menu</span>
        ☰
      </button>

      <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
        <ul id="main-nav-list">
          <!-- Links injetados via JS conforme o role do usuário -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="container">

      <h1 class="page-title">Dashboard do Administrador</h1>
      <p class="page-subtitle">Gerencie os usuários cadastrados na plataforma.</p>

      <!-- ================= GESTÃO DE USUÁRIOS ================= -->
      <section class="data-panel card" aria-labelledby="users-title">
        <div class="panel-toolbar">
          <h2 class="section-title" id="users-title" style="margin-bottom: 0;">Usuários</h2>

          <div class="form-group">
            <label for="user-busca" class="visually-hidden">Buscar usuário</label>
            <input type="search" id="user-busca" placeholder="Buscar por nome ou e-mail..." />
          </div>

          <div class="form-group">
            <label for="user-filtro-role" class="visually-hidden">Filtrar por role</label>
            <select id="user-filtro-role">
              <option value="">Todos os roles</option>
              <option value="aluno">Aluno</option>
              <option value="editor">Editor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="data-table-wrapper">
          <table class="data-table">
            <caption class="visually-hidden">Lista de usuários cadastrados</caption>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Role</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <!-- Linhas injetadas via js/components/userTable.js, ex:
              <tr>
                <td>Nome do usuário</td>
                <td>email@exemplo.com</td>
                <td>
                  <select class="role-select">
                    <option value="aluno">Aluno</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Admin</option>
                  </select>
                </td>
                <td><span class="badge badge-success">Ativo</span></td>
                <td class="actions-cell">
                  <button class="btn btn-secondary btn-sm">Desativar</button>
                </td>
              </tr>
              -->
            </tbody>
          </table>
        </div>

        <p id="user-table-empty" class="empty-state" hidden>Nenhum usuário encontrado.</p>
      </section>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 EduPlay. Todos os direitos reservados.</span>
      <nav aria-label="Links do rodapé">
        <a href="#">Termos de uso</a>
        <a href="#">Privacidade</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
