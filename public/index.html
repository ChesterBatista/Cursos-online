<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Plataforma de Cursos Online</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-split">

    <!-- ================= PAINEL DO FORMULÁRIO ================= -->
    <div class="auth-panel-form">
      <div class="auth-form-wrap">
        <a href="index.html" class="logo auth-logo">MC Cursos</a>

        <h1 id="login-title" class="auth-title">Bem-vindo de volta!</h1>
        <p class="auth-subtitle">Entre com suas credenciais para acessar sua conta</p>

        <!-- Alerta de erro de autenticação, controlado via JS -->
        <div id="login-alert" class="alert alert-error" role="alert" hidden></div>

        <form id="login-form" novalidate aria-labelledby="login-title">
          <div class="form-group auth-field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="Digite seu e-mail"
              required
            />
            <span class="form-error" id="email-error"></span>
          </div>

          <div class="form-group auth-field">
            <div class="auth-field-header">
              <label for="senha">Senha</label>
              <a href="#" id="forgot-password-link" class="auth-link auth-link-sm">Esqueci minha senha</a>
            </div>
            <input
              type="password"
              id="senha"
              name="senha"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            />
            <span class="form-error" id="senha-error"></span>
          </div>

          <label class="checkbox-inline auth-remember">
            <input type="checkbox" id="lembrar" name="lembrar" />
            Lembrar de mim por 30 dias
          </label>

          <button type="submit" id="login-submit" class="btn btn-primary btn-block auth-submit">
            Entrar
          </button>
        </form>

        <div class="auth-divider"><span>ou</span></div>

        <div class="auth-oauth">
          <button type="button" class="btn btn-secondary auth-oauth-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#FFC107" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/>
              <path fill="#4CAF50" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FF3D00" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
              <path fill="#1976D2" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            Entrar com Google
          </button>
          <button type="button" class="btn btn-secondary auth-oauth-btn">
            <svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true">
              <path fill="currentColor" d="M13.1 9.5c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.7-3.1.7-.6 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2-1.5 2.5-.4 6.3 1 8.3.7 1 1.5 2.1 2.6 2 1-.1 1.4-.7 2.7-.7s1.6.7 2.7.6c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.2-.8-2.2-3.1zM10.9 3.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.6-1.2z"/>
            </svg>
            Entrar com Apple
          </button>
        </div>

        <p class="auth-switch">
          Ainda não tem conta?
          <a href="#" id="register-link" class="auth-link">Criar conta</a>
        </p>
      </div>
    </div>

    <!-- ================= PAINEL DE ARTE ================= -->
    <div class="auth-panel-art" aria-hidden="true">
      <img src="img/login-plant.jpg" alt="" class="auth-art-image" />
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
